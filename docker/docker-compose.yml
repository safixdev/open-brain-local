# docker/docker-compose.yml
# Open Brain — docker-compose stack (pgvector + TEI embeddings + MCP server)
#
# Prerequisites:
#   cp .env.example .env
#   cp .env.secrets.example .env.secrets
#   # Edit .env.secrets: set MCP_ACCESS_KEY and POSTGRES_PASSWORD
#
# Start:
#   docker compose up -d
#
# On first run TEI loads the embedding model (~0.67 GB); the server waits until
# tei is healthy. Behind a proxy that blocks HF's CDN, pre-fetch the model into
# ./tei-model and set EMBED_MODEL=/model (see the open-brain-up skill).

services:
  db:
    image: pgvector/pgvector:pg16
    env_file:
      - .env
      - .env.secrets
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: "${POSTGRES_DB:-openbrain}"
    volumes:
      - openbrain-pg-data:/var/lib/postgresql/data
      - ./init/01-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Embedding backend: HuggingFace Text Embeddings Inference (CPU, Rust).
  # ~343 MB image vs Ollama's ~4 GB. Serves an OpenAI-compatible /v1/embeddings.
  # Apple Silicon / arm64 hosts: set TEI_IMAGE to the cpu-arm64 tag in .env.
  tei:
    image: "${TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.9}"
    command:
      - "--model-id"
      - "${EMBED_MODEL:-mixedbread-ai/mxbai-embed-large-v1}"
      - "--port"
      - "8080"
      - "--auto-truncate"
    environment:
      HUGGINGFACE_HUB_CACHE: /data
      # Xet CDN (us.aws.cdn.hf.co) is often blocked by corporate TLS proxies;
      # disabling it routes weight downloads through huggingface.co directly.
      HF_HUB_DISABLE_XET: "1"
    volumes:
      - openbrain-tei-data:/data
      # Air-gapped / corp-proxy networks that block HF's CDN: pre-fetch the model
      # on the host into ${TEI_MODEL_DIR} and set EMBED_MODEL=/model (see README).
      # On open networks leave EMBED_MODEL as the HF id and this mount is unused.
      - "${TEI_MODEL_DIR:-./tei-model}:/model:ro"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  server:
    # Distribution:
    #   • Build from source (option A): leave OPENBRAIN_IMAGE unset, run
    #     `docker compose build server` — the image is tagged `openbrain-mcp-server:local`.
    #   • Prebuilt from a registry (option B): set OPENBRAIN_IMAGE to the pushed
    #     ref (e.g. acme.jfrog.io/openbrain-docker/openbrain-mcp-server:v1.0.0),
    #     then `docker compose pull server && docker compose up -d --no-build`.
    image: "${OPENBRAIN_IMAGE:-openbrain-mcp-server:local}"
    build:
      context: ..
      dockerfile: docker/Dockerfile
      secrets:
        - ca
    depends_on:
      db:
        condition: service_healthy
      tei:
        condition: service_healthy
    # Bound to loopback only: the MCP endpoint is a private, per-developer detail.
    # Sharing happens via Artifactory (the SOT), not this port. To expose it on a
    # network you MUST add auth + TLS at an ingress first.
    ports:
      - "127.0.0.1:${PORT:-8787}:8000"
    env_file:
      - .env
      - .env.secrets
    environment:
      JF_PATH: /usr/local/bin/jf
    volumes:
      - ./jfrog-config:/home/deno/.jfrog:ro
    healthcheck:
      # `deno eval` runs with implicit permissions, so no --allow-net flag.
      test: ["CMD", "deno", "eval", "const r=await fetch('http://localhost:8000/health').catch(()=>null);Deno.exit(r&&r.ok?0:1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

# Build-time CA for the server image. Behind a corporate TLS proxy, set
# CA_CERT_FILE to your CA path before building:
#   CA_CERT_FILE=./corp-ca.pem docker compose up -d --build
# Defaults to /dev/null (empty) → the build secret is a no-op on clean networks.
volumes:
  openbrain-pg-data:
  openbrain-tei-data:

secrets:
  ca:
    file: ${CA_CERT_FILE:-/dev/null}
